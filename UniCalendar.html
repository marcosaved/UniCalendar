<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Go to Calendar</title>
   <link rel="icon" type="image/png" href="UniboLOGO.png">

  <!-- PWA setup -->
  <meta name="theme-color" content="#4a90e2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  
  <style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
    margin: 0;
  }

  button {
    background: #9C2007;
    color: white;
    font-size: clamp(1rem, 5vw, 1.5rem); /* responsive font size */
    font-weight: bold;
    padding: 1em 2em; /* scales with font size */
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, background 0.3s ease;
    width: 80%;            /* take most of screen width */
    max-width: 400px;      /* but not too wide on large screens */
  }

  button:hover {
    background: #C82909;
  }

  button:active {
    transform: scale(0.95);
  }
</style>
  <script>
    function goToCalendar() {
      // Base URL
      let url = "https://corsi.unibo.it/2cycle/AerospaceEngineering/timetable?anno=2&curricula=B79-000&calendar_view=&date=2025-09-15&insegnamenti=2025-000-370242--I%7C93853&insegnamenti=2025-000-370241--I%7C73205&insegnamenti=2025-000-394159--I%7C73194_1&insegnamenti=2025-000-394160--I%7C73194_2&insegnamenti=2025-000-385429--I%7C73198&insegnamenti=2025-000-398341--I%7C93850";
      
      // Get today's date in YYYY-MM-DD
      let today = new Date();
      let year = today.getFullYear();
      let month = String(today.getMonth() + 1).padStart(2, '0');
      let day = String(today.getDate()).padStart(2, '0');
      let formattedDate = `${year}-${month}-${day}`;
      
      // Replace the old date with today's date
      let finalUrl = url.replace(/date=\d{4}-\d{2}-\d{2}/, `date=${formattedDate}`);
      
      // Open in the same tab
      window.location.href = finalUrl;
    }
  </script>
</head>
<body>
  <button onclick="goToCalendar()">Go to Calendar</button>
</body>
</html>
